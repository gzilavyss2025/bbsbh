<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" style="color:#1B2A3A">
  <title>Concept 1 — The Cancellation: CHC at MIL, Final MIL 5 CHC 3, American Family Field, Aug 2 2026</title>
  <style>
    text { fill: currentColor; }
    .ring   { font: 600 13.5px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 2.2px; }
    .label  { font: 600 11px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 3px; }
    .at     { font: 600 10px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 1.5px; }
    .cap    { font: 600 8.5px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 1.5px; }
    .num-w  { font: 700 32px "IBM Plex Mono",ui-monospace,monospace; }
    .num-l  { font: 400 24px "IBM Plex Mono",ui-monospace,monospace; }
  </style>
  <defs>
    <!-- Rubber-stamp ink roughening: pure-vector displacement, no raster texture -->
    <filter id="ink-778241" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <!-- Text baselines: top text sits on r=122 (caps grow outward), bottom text on r=135 (caps grow inward-up) -->
    <path id="arcTop-778241" d="M 28,150 A 122,122 0 0 1 272,150" fill="none"/>
    <path id="arcBot-778241" d="M 15,150 A 135,135 0 0 0 285,150" fill="none"/>
    <!-- Mono club marks (white-on-transparent) used as luminance masks over currentColor rects.
         Ids are gamePk-suffixed so many stamps can share a page. -->
    <mask id="c1a-778241">
      <image href="/data/logos/mono/112.svg" x="84" y="104" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    </mask>
    <mask id="c1h-778241">
      <image href="/data/logos/mono/158.svg" x="162" y="104" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    </mask>
  </defs>

  <g filter="url(#ink-778241)">
    <!-- Chrome: double bounding ring -->
    <circle cx="150" cy="150" r="140" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <circle cx="150" cy="150" r="118" fill="none" stroke="currentColor" stroke-width="1.5"/>

    <!-- Ring text: venue above, date below (data-driven) -->
    <text class="ring"><textPath href="#arcTop-778241" startOffset="50%" text-anchor="middle">AMERICAN FAMILY FIELD</textPath></text>
    <text class="ring"><textPath href="#arcBot-778241" startOffset="50%" text-anchor="middle">AUGUST 2 · 2026</textPath></text>

    <!-- Fixed chrome: diamond separators at 9 and 3 o'clock -->
    <path d="M 21,144 l 6,6 -6,6 -6,-6 z" fill="currentColor"/>
    <path d="M 279,144 l 6,6 -6,6 -6,-6 z" fill="currentColor"/>

    <!-- Status word: FINAL, or FINAL / 10 for extras (data-driven) -->
    <text class="label" x="150" y="97" text-anchor="middle">FINAL</text>

    <!-- Central emblem pair: away AT home, in scorebook order -->
    <rect x="84" y="104" width="54" height="54" fill="currentColor" mask="url(#c1a-778241)"/>
    <text class="at" x="150" y="134" text-anchor="middle">AT</text>
    <rect x="162" y="104" width="54" height="54" fill="currentColor" mask="url(#c1h-778241)"/>

    <line x1="80" y1="170" x2="220" y2="170" stroke="currentColor" stroke-width="1.5"/>

    <!-- Run totals under each mark; winner bold + underscored -->
    <text class="num-l" x="111" y="202" text-anchor="middle">3</text>
    <text class="num-w" x="189" y="204" text-anchor="middle">5</text>
    <line x1="175" y1="211" x2="203" y2="211" stroke="currentColor" stroke-width="2.5"/>

    <!-- Abbrev captions: textual anchor + the fallback when a mono mark is missing -->
    <text class="cap" x="111" y="226" text-anchor="middle">CHC</text>
    <text class="cap" x="189" y="226" text-anchor="middle">MIL</text>
  </g>
</svg>
