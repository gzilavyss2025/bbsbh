<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" style="color:#1B2A3A">
  <title>Concept 2 — The Stub: CHC 3 at MIL 5, American Family Field, Aug 2 2026</title>
  <style>
    text { fill: currentColor; }
    .brand { font: 600 9px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 1.2px; }
    .venue { font: 600 10.5px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 1.5px; }
    .colhd { font: 600 9px "IBM Plex Sans Condensed","Arial Narrow",sans-serif; letter-spacing: 1.5px; }
    .abbr  { font: 700 22px "IBM Plex Mono",ui-monospace,monospace; }
    .num-l { font: 400 25px "IBM Plex Mono",ui-monospace,monospace; }
    .num-w { font: 700 27px "IBM Plex Mono",ui-monospace,monospace; }
    .date  { font: 600 14px "IBM Plex Mono",ui-monospace,monospace; letter-spacing: 1px; }
    .serial{ font: 400 8.5px "IBM Plex Mono",ui-monospace,monospace; letter-spacing: 2.5px; }
  </style>
  <defs>
    <!-- Lighter roughening than the round stamp: the ticket carries 8.5px serial type -->
    <filter id="ink2-778241" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
    <mask id="c2a-778241">
      <image href="/data/logos/mono/112.svg" x="30" y="107" width="38" height="38" preserveAspectRatio="xMidYMid meet"/>
    </mask>
    <mask id="c2h-778241">
      <image href="/data/logos/mono/158.svg" x="30" y="159" width="38" height="38" preserveAspectRatio="xMidYMid meet"/>
    </mask>
  </defs>

  <g filter="url(#ink2-778241)">
    <!-- Ticket body -->
    <rect x="18" y="64" width="264" height="172" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>

    <!-- Tear line separating the stub -->
    <line x1="222" y1="66" x2="222" y2="234" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="1 7"/>

    <!-- ==== MAIN PANEL (x 18..222) ==== -->
    <!-- Top band -->
    <text class="brand" x="30" y="86">TALLY BASEBALL</text>
    <text class="brand" x="210" y="86" text-anchor="end">FINAL / 9</text>
    <line x1="30" y1="94" x2="210" y2="94" stroke="currentColor" stroke-width="1.25"/>

    <!-- R column header -->
    <text class="colhd" x="183" y="103" text-anchor="middle">R</text>

    <!-- Away row (loser here): mark + code + single hairline cell -->
    <rect x="30" y="107" width="38" height="38" fill="currentColor" mask="url(#c2a-778241)"/>
    <text class="abbr" x="78" y="135">CHC</text>
    <rect x="160" y="106" width="46" height="40" fill="none" stroke="currentColor" stroke-width="1.25"/>
    <text class="num-l" x="183" y="135" text-anchor="middle">3</text>

    <line x1="30" y1="152" x2="210" y2="152" stroke="currentColor" stroke-width="0.75"/>

    <!-- Home row (winner): mark + code + double-ruled cell + bold numeral -->
    <rect x="30" y="159" width="38" height="38" fill="currentColor" mask="url(#c2h-778241)"/>
    <text class="abbr" x="78" y="187">MIL</text>
    <rect x="160" y="158" width="46" height="40" fill="none" stroke="currentColor" stroke-width="2.25"/>
    <rect x="164" y="162" width="38" height="32" fill="none" stroke="currentColor" stroke-width="0.75"/>
    <text class="num-w" x="183" y="187" text-anchor="middle">5</text>

    <!-- Bottom band: venue -->
    <line x1="30" y1="210" x2="210" y2="210" stroke="currentColor" stroke-width="1.25"/>
    <text class="venue" x="30" y="226">AMERICAN FAMILY FIELD</text>

    <!-- ==== STUB (x 222..282): rotated date + serial (gamePk), punch hole ==== -->
    <circle cx="254" cy="84" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text class="date" transform="translate(246,158) rotate(-90)" text-anchor="middle">AUG 2, 2026</text>
    <text class="serial" transform="translate(269,158) rotate(-90)" text-anchor="middle">NO. 778241</text>
  </g>
</svg>
