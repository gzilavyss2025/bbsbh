name: Update nightly data

# Nightly precompute batch: game notes, WAR, rehab assignments, umpires,
# umpire plate accuracy, minor-league leaders, game call-outs, former
# teammates, career matchups, vs-team splits, milestone watch, team
# transactions, the Fever Baseball radar and contract snapshots (each documented at the top
# of its own scripts/gen-*.mjs) in ONE workflow with a SINGLE commit+push,
# instead of separate crons each triggering its own Vercel deployment.
# Consolidated 2026-07-11 after two of the eight (update-callouts and
# update-former-teammates, both previously at 10:30 UTC) collided on the
# push — a non-fast-forward rejection that silently dropped that night's
# call-outs. README regen was folded in on 2026-07-17 for the same reason,
# then ripped back out on 2026-07-21: its Claude Code Action step has no
# working ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN secret, and on failure it
# left the git remote's push auth pointed at its own (invalid) OIDC token
# instead of the checkout's GH_BOT_TOKEN — silently discarding every
# generator's output at the final push for every run from 2026-07-18 to
# 2026-07-21.
# DO NOT PUT README REGEN BACK IN THIS FILE. It needs an Anthropic credential
# this repo has never had (GH_BOT_TOKEN is the only secret set), and the
# action that carries one repoints the git remote's auth — which is what cost
# four nights of generator output above. It moved to the /start-day skill on
# 2026-08-28: that runs in the maintainer's own Claude Code session, on his
# own auth, so there is no secret to add and no second credential inside this
# job. It also puts a human on a user-facing prose diff before it lands.
# regenerate-readme.yml is deleted; nothing here regenerates the README.
#
# The three WEEKLY crons folded in here on 2026-08-28 (update-teams.yml,
# update-affiliates.yml, update-top-prospects.yml — all deleted). They ran
# Monday 09:00/10:00/10:00 UTC, i.e. AFTER this 07:00 batch, and five steps
# below read what they write: gen-minors-leaders + gen-team-records read
# teams.json, gen-milb-alumni + gen-farm-system read affiliates.json, and
# gen-farm-system + gen-prospect-trend read top-prospects.json. So every
# Monday those five ran on the PREVIOUS week's files and the fresh ones only
# reached them on Tuesday — the Farm Report and the prospect-trend percentile
# disagreed with the /prospects page for ~21 hours a week, with nothing red
# anywhere. Same cross-file ordering bug as "Postseason odds" after "Team
# Scores" below, one workflow up. They now run Monday-gated at the TOP of this
# job, before any consumer, and inherit this file's rebase-retry push — none
# of the three had one, and affiliates + top-prospects were scheduled at the
# same MINUTE, the exact collision that forced the 2026-07-11 consolidation.
# Monday-gated rather than nightly because fetch-top-prospects.mjs scrapes
# www.mlb.com (be a good citizen) and gen-mono-logos.mjs pulls a mark per club
# at five levels; the underlying data moves once a year at most.
# gen-comeback-wins.mjs was added to the batch without joining the commit
# step's `git add` list or the fail-check below — harmless on a clean
# fast-forward push, but its always-unstaged output broke the push-race
# rebase retry the first time two nightly runs collided (2026-07-21).
# gen-jerseys.mjs had the same class of bug from the day it was added: the
# `git add` list staged scripts/data/jerseys.sql (the SQL dump) but never
# public/data/jerseys.json (the derived export src/api/jerseys.js actually
# reads), so every night's real jersey/logo-treatment classification was
# computed and written to the runner's working tree, then silently discarded
# at commit time — the deployed jerseys.json never advanced past its last
# hand-run backfill. The slate card's per-game logo swap fell back to
# defaultTreatmentFor's side-only guess for every game since, with no
# generator failure to surface it. Fixed 2026-07-25.
# A GENERATOR THAT WRITES A DIRECTORY MUST STAGE THE DIRECTORY. Two do now:
# gen-vs-team-splits.mjs writes public/data/vs-team-splits/ (one shard per
# club plus an index — it used to be one file), and gen-rookies.mjs writes
# BOTH public/data/rookies.json (the append-only master) and the derived
# public/data/rookies/ the app actually reads. Staging only the old path
# would be the jerseys.json bug again, one level up.
# scripts/warm-previews.mjs (added 2026-07-22) is the one step here that
# ISN'T a gen-*.mjs data generator — it writes no public/data/* file, so it
# deliberately has no entry in the commit step's `git add` list, only in the
# fail-check below. It proactively warms api/preview.js + api/og.js's edge
# cache for today's MLB slate against bbsbh.vercel.app itself.
# The generators here are otherwise unchanged and fully independent (each
# writes its own public/data/* file with no read dependency on another's
# output — gen-callouts.mjs reads the vs-team splits only at app runtime,
# never at generation time), so continue-on-error lets one script's failure
# fall through to the rest instead of blocking the batch; the job still
# fails at the end (for cron-failure visibility in the Actions tab) if
# anything errored, but whatever succeeded is already committed by then.
on:
  schedule:
    - cron: '0 7 * * *' # ~3am US Eastern (2-3am during EST) — moved earlier 2026-07-22; the "Wait for yesterday's slate" step below backs off hourly if a late West Coast game is still in progress, up to the old ~7am ET ceiling, instead of always waiting that long
  workflow_dispatch:
    inputs:
      run_weekly:
        description: 'Also run the weekly steps (teams, club marks, MiLB parks, affiliates, top prospects) whatever day it is'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-nightly-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # main requires the lint-and-build status check, which the default
          # GITHUB_TOKEN can never satisfy on a bare push (no PR = no check
          # run for that commit, and a PR opened with GITHUB_TOKEN doesn't
          # even trigger CI — GitHub suppresses workflow-triggered-workflow
          # chains) — every run since 2026-07-13 had its commit silently
          # rejected at the final push, discarding that night's generator
          # output. GH_BOT_TOKEN is a fine-grained PAT for the repo owner
          # (admin), so pushes with it bypass the required check the same
          # way the maintainer's own direct pushes already do.
          token: ${{ secrets.GH_BOT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # node:sqlite ships stable here (docs/adr/0021) — gen-team-score.mjs/gen-season-score.mjs need it

      - name: Wait for yesterday's slate to go Final
        run: |
          for i in 1 2 3 4; do
            node scripts/check-slate-final.mjs && exit 0
            echo "attempt $i/4: not all games settled yet — waiting 1 hour"
            sleep 3600
          done
          echo "still not all settled after 4 hours — proceeding anyway (matches the old fixed ~7am ET run time)"

      # ---- Weekly block (Mondays only) ----------------------------------
      # Was three separate Monday crons until 2026-08-28; see the header for
      # why they moved and why they now sit ABOVE every generator that reads
      # what they write. Everything in this block is skipped six days a week,
      # so `steps.<id>.outcome` is 'skipped' — not 'failure' — on those days,
      # which is what keeps the fail-check at the bottom quiet.
      - name: Weekly steps due?
        id: weekly
        env:
          FORCE: ${{ github.event.inputs.run_weekly }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "Weekly steps are due (Monday, or forced via workflow_dispatch)."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not Monday — skipping the weekly steps."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Teams
        id: teams
        if: steps.weekly.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/gen-teams.mjs
      # Both of the next two READ the teams.json the step above just wrote, so
      # both are gated on it having actually succeeded — not merely on it being
      # Monday. Without that gate a failed teams fetch would leave last week's
      # file on disk and these two would rebuild happily against it, publishing
      # marks and a park list for a stale team set with nothing marked red.
      # Same gate, same reason, as "Club ledgers and league salaries" below.
      - name: Club marks
        id: mono-logos
        if: steps.weekly.outputs.due == 'true' && steps.teams.outcome == 'success'
        continue-on-error: true
        run: node scripts/gen-mono-logos.mjs
      - name: MiLB ballparks
        id: milb-ballparks
        if: steps.weekly.outputs.due == 'true' && steps.teams.outcome == 'success'
        continue-on-error: true
        run: node scripts/gen-milb-ballparks.mjs
      - name: Affiliates
        id: affiliates
        if: steps.weekly.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/gen-affiliates.mjs
      - name: Top prospects
        id: top-prospects
        if: steps.weekly.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/fetch-top-prospects.mjs
      # ---- End weekly block ---------------------------------------------

      - name: Game notes
        id: game-notes
        continue-on-error: true
        run: node scripts/gen-game-notes.mjs
      - name: WAR
        id: war
        continue-on-error: true
        run: node scripts/gen-war.mjs
      # Directly after WAR, and not by accident: gen-milb-alumni.mjs reads the
      # war.json the step above just wrote (plus the committed war-history
      # shards and affiliates.json) to rank each farm club's alumni. Run it
      # before WAR and it ranks on yesterday's numbers.
      - name: MiLB alumni
        id: milb-alumni
        continue-on-error: true
        run: node scripts/gen-milb-alumni.mjs
      - name: Rehab assignments
        id: rehab
        continue-on-error: true
        run: node scripts/gen-rehab.mjs
      - name: Umpires
        id: umpires
        continue-on-error: true
        run: node scripts/gen-umpires.mjs
      - name: Umpire accuracy
        id: umpire-accuracy
        continue-on-error: true
        run: node scripts/gen-umpire-accuracy.mjs
      - name: Minor-league leaders
        id: minors-leaders
        continue-on-error: true
        run: node scripts/gen-minors-leaders.mjs
      - name: Game call-outs
        id: callouts
        continue-on-error: true
        run: node scripts/gen-callouts.mjs
      - name: Former teammates
        id: former-teammates
        continue-on-error: true
        run: node scripts/gen-former-teammates.mjs
      - name: Career matchups
        id: career-matchups
        continue-on-error: true
        run: node scripts/gen-career-matchups.mjs
      - name: Foul tracker
        id: fouls
        continue-on-error: true
        run: node scripts/gen-fouls.mjs
      - name: Pitcher workload
        id: workload
        continue-on-error: true
        run: node scripts/gen-workload.mjs
      - name: Vs-team splits
        id: vs-team-splits
        continue-on-error: true
        run: node scripts/gen-vs-team-splits.mjs
      - name: Savant percentiles
        id: savant-percentiles
        continue-on-error: true
        run: node scripts/gen-savant-percentiles.mjs
      - name: Savant matchup rates
        id: savant-matchup
        continue-on-error: true
        run: node scripts/gen-savant-matchup.mjs
      - name: Milestone watch
        id: milestones
        continue-on-error: true
        run: node scripts/gen-milestones.mjs
      - name: Rookie status
        id: rookies
        continue-on-error: true
        run: node scripts/gen-rookies.mjs
      - name: Season Surprise Score
        id: season-score
        continue-on-error: true
        run: node scripts/gen-season-score.mjs
      - name: Team Scores
        id: team-score
        continue-on-error: true
        run: node scripts/gen-team-score.mjs
      - name: Team transactions
        id: team-transactions
        continue-on-error: true
        run: node scripts/gen-team-transactions.mjs
      # MUST stay after "Team Scores": gen-postseason-odds.mjs reads
      # public/data/team-score.json for each club's strength, so running it
      # first would simulate the rest of the season off yesterday's teams.
      #
      # This step is new, and its absence was the bug. The generator was
      # written for exactly this cadence — its header says "Normal nightly use
      # appends yesterday's snapshot" — but it was never added here, so the
      # Team hub's postseason-odds card was serving the last snapshot anyone
      # happened to produce by hand: 2026-07-17, twenty-three days stale by the
      # time it was noticed, in the middle of a pennant race, with nothing on
      # screen to say so. A date-keyed file degrades quietly, which is why this
      # kind of miss survives.
      - name: Postseason odds
        id: postseason-odds
        continue-on-error: true
        run: node scripts/gen-postseason-odds.mjs
      # Also written for this cron and never wired to it: the generator's own
      # header points at this file ("Meant for a nightly cron (NOT yet wired)")
      # and even drafts the step. --current-only re-sweeps THIS season's 30
      # coaching staffs (~30 calls) and merges, so the backfilled history the
      # full run established survives. Without it a mid-season managerial
      # change never reached /manager/{id}.
      - name: Manager history (current season)
        id: manager-history
        continue-on-error: true
        run: node scripts/gen-manager-history.mjs --current-only
      - name: Fever Baseball radar
        id: fever-radar
        continue-on-error: true
        run: node scripts/gen-fever-radar.mjs
      - name: Player contracts
        id: player-contracts
        continue-on-error: true
        run: node scripts/fever/gen-player-contracts.mjs
      # MUST stay directly after "Player contracts": gen-salaries.mjs rolls up the
      # shards that step writes rather than calling Fever's feed a second time, so
      # running it first would publish yesterday's contracts under today's stamp.
      # Same ordering requirement, same reason, as "Postseason odds" after "Team
      # Scores" further up this file.
      #
      # Ordering alone was not enough. Both steps are continue-on-error, so a
      # failed contracts fetch used to leave the previous run's shards on disk and
      # this step would roll them up anyway — yesterday's money joined to today's
      # rosters, committed and shipped with nothing in the run marked red.
      # gen-salaries.mjs cannot catch that itself: it throws on an EMPTY shard
      # directory, never a stale one. So the gate has to be here.
      - name: Club ledgers and league salaries
        id: salaries
        if: steps.player-contracts.outcome == 'success'
        continue-on-error: true
        run: node scripts/fever/gen-salaries.mjs
      - name: Prospect level percentile
        id: prospect-trend
        continue-on-error: true
        run: node scripts/gen-prospect-trend.mjs
      - name: Comeback wins
        id: comeback-wins
        continue-on-error: true
        run: node scripts/gen-comeback-wins.mjs
      - name: Jerseys
        id: jerseys
        continue-on-error: true
        run: node scripts/gen-jerseys.mjs
      - name: Pitch arsenal
        id: pitch-arsenal
        continue-on-error: true
        run: node scripts/gen-pitch-arsenal.mjs
      # The batter-side sibling of the step above, off the same two levels and
      # the same trailing window: where every ball in play landed. It writes a
      # DIRECTORY (public/data/spray/, one bucket per `personId % 100`) plus its
      # own ingested-games ledger (scripts/data/spray-ingested.json), and BOTH
      # are staged below — the ledger is what stops the next run re-sweeping the
      # season, so committing the buckets without it would make every night a
      # full backfill.
      - name: Spray map
        id: spray
        continue-on-error: true
        run: node scripts/gen-spray.mjs
      # The Ballpark card's own attendance file. Stateless like the Gate step
      # below and off the same hydrated schedule feed — it used to fetch a
      # boxscore per game (~1,900 requests, SQLite, an ingested-games table)
      # and no longer does; see gen-attendance.mjs's header.
      - name: Attendance
        id: attendance
        continue-on-error: true
        run: node scripts/gen-attendance.mjs
      # The Gate + The Clock (src/screens/around-the-game/). One stateless sweep of the
      # schedule feed's gameInfo hydration — no SQLite and no incremental
      # window, so it rebuilds the whole season each night in about a dozen
      # requests. Deliberately separate from the Attendance step above, which
      # owns the Ballpark card's own, much smaller file.
      - name: Gate and pace
        id: gate
        continue-on-error: true
        run: node scripts/gen-gate.mjs
      # The Farm Report. READS two files it does not fetch —
      # public/data/affiliates.json and public/data/top-prospects.json — and
      # joins them to live minor-league standings. Both come from the weekly
      # block at the top of this job (they used to come from two separate
      # Monday crons that ran AFTER this one, which is exactly why this step
      # spent every Monday on week-old rankings). MUST stay below that block.
      # the doubleheader report. A full rebuild of 2004-to-now every night — twenty-three
      # schedule requests with a narrow fields filter — because only the current
      # season's rows can change and the file is 20 KB either way. No SQLite,
      # nothing incremental, nothing to backfill.
      - name: Doubleheaders
        id: doubleheaders
        continue-on-error: true
        run: node scripts/gen-doubleheaders.mjs
      - name: Farm system
        id: farm-system
        continue-on-error: true
        run: node scripts/gen-farm-system.mjs
      - name: Video highlights
        id: highlights
        continue-on-error: true
        run: node scripts/gen-highlights.mjs
      # Reads public/data/teams.json for each club's league and division, so it
      # MUST stay below the weekly block at the top of this job that writes it
      # (that file used to come from update-teams.yml, a separate Monday cron
      # that ran two hours AFTER this one). Append-only over newly-Final games
      # at all five levels.
      - name: Team situational records
        id: team-records
        continue-on-error: true
        run: node scripts/gen-team-records.mjs
      - name: Warm preview cache
        id: warm-previews
        continue-on-error: true
        run: node scripts/warm-previews.mjs
      # Like warm-previews, not a gen-*.mjs data generator and writes no
      # committed file — it needs real network to catch statsapi renaming or
      # dropping a field bbsbh's captured e2e fixture depends on, which is
      # exactly what this cron has and CI (npm run lint) doesn't. See the
      # script's own header for why it's scoped to the anchor game only.
      - name: Feed-shape drift check
        id: feed-shape-drift
        continue-on-error: true
        run: node scripts/check-feed-shape-drift.mjs
      # Like warm-previews, not a gen-*.mjs data generator — but unlike it,
      # this one DOES write committed files (recompressed curated logo PNGs +
      # the rebuilt logo-art.json manifest), so it IS in the commit step's
      # `git add` list below. Palette PNGs are skipped, so a night with no new
      # Identity Lab uploads is a no-op. sharp is installed here on demand —
      # the generators above deliberately run with no npm install at all
      # (scripts/CLAUDE.md), and this keeps it that way for them.
      - name: Compress curated logos
        id: compress-logos
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/compress-logos.mjs
          node scripts/gen-logo-art.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/teams.json public/data/logos/mono src/lib/data/mono-logo-manifest.json src/lib/data/milb-ballparks.json public/data/affiliates.json public/data/top-prospects.json public/data/game-notes public/data/war.json public/data/milb-alumni scripts/data/milb-alumni-scan.json public/data/rehab.json public/data/umpires public/data/umpire-accuracy public/data/umpire-accuracy-summary.json public/data/minors-leaders.json public/data/callouts public/data/former-teammates public/data/career-matchups.json public/data/fouls.json public/data/fouls public/data/workload.json scripts/data/fouls.sql public/data/vs-team-splits public/data/savant-percentiles.json public/data/savant-matchup.json public/data/milestones.json public/data/rookies.json public/data/rookies public/data/season-score.json public/data/team-score.json public/data/team-transactions public/data/fever-radar.json public/data/player-contracts public/data/team-contracts public/data/salaries.json public/data/prospect-trend.json public/data/postseason-odds.json public/data/manager-history scripts/data/team-snapshots.sql scripts/data/player-snapshots.sql public/data/comeback-wins.json scripts/data/comeback-wins.sql scripts/data/jerseys.sql public/data/jerseys.json public/data/pitch-arsenal public/data/pitch-arsenal-pool scripts/data/pitch-arsenal.sql public/data/spray scripts/data/spray-ingested.json public/data/attendance.json public/data/gate.json public/data/doubleheaders.json public/data/farm-system.json public/data/highlights public/data/team-records scripts/data/team-records.sql public/team-logos src/lib/data/logo-art.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update nightly data"
          # Retry with a rebase on a push race — a concurrent push to main
          # (a manual workflow_dispatch run, a maintainer's own direct push,
          # another cron) would otherwise get silently rejected here.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "$(git rev-parse --abbrev-ref HEAD)"
            git rebase "origin/$(git rev-parse --abbrev-ref HEAD)"
            sleep $((RANDOM % 10 + 1))
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Fail if any generator errored
        if: |
          steps.teams.outcome == 'failure' ||
          steps.mono-logos.outcome == 'failure' ||
          steps.milb-ballparks.outcome == 'failure' ||
          steps.affiliates.outcome == 'failure' ||
          steps.top-prospects.outcome == 'failure' ||
          steps.game-notes.outcome == 'failure' ||
          steps.war.outcome == 'failure' ||
          steps.milb-alumni.outcome == 'failure' ||
          steps.rehab.outcome == 'failure' ||
          steps.umpires.outcome == 'failure' ||
          steps.umpire-accuracy.outcome == 'failure' ||
          steps.minors-leaders.outcome == 'failure' ||
          steps.callouts.outcome == 'failure' ||
          steps.former-teammates.outcome == 'failure' ||
          steps.career-matchups.outcome == 'failure' ||
          steps.fouls.outcome == 'failure' ||
          steps.workload.outcome == 'failure' ||
          steps.vs-team-splits.outcome == 'failure' ||
          steps.savant-percentiles.outcome == 'failure' ||
          steps.savant-matchup.outcome == 'failure' ||
          steps.milestones.outcome == 'failure' ||
          steps.rookies.outcome == 'failure' ||
          steps.season-score.outcome == 'failure' ||
          steps.team-score.outcome == 'failure' ||
          steps.team-transactions.outcome == 'failure' ||
          steps.postseason-odds.outcome == 'failure' ||
          steps.manager-history.outcome == 'failure' ||
          steps.fever-radar.outcome == 'failure' ||
          steps.player-contracts.outcome == 'failure' ||
          steps.salaries.outcome == 'failure' ||
          steps.prospect-trend.outcome == 'failure' ||
          steps.comeback-wins.outcome == 'failure' ||
          steps.jerseys.outcome == 'failure' ||
          steps.pitch-arsenal.outcome == 'failure' ||
          steps.spray.outcome == 'failure' ||
          steps.attendance.outcome == 'failure' ||
          steps.gate.outcome == 'failure' ||
          steps.doubleheaders.outcome == 'failure' ||
          steps.farm-system.outcome == 'failure' ||
          steps.highlights.outcome == 'failure' ||
          steps.team-records.outcome == 'failure' ||
          steps.warm-previews.outcome == 'failure' ||
          steps.compress-logos.outcome == 'failure' ||
          steps.feed-shape-drift.outcome == 'failure'
        run: |
          echo "One or more nightly generators failed — see the step logs above."
          exit 1
