name: Research store

# Builds the /research store (#2234) from Baseball Savant and uploads it to Vercel
# Blob (research/v1/). Hand-run only for now: run it once, check the files, then the
# upload joins update-nightly-data.yml. Writes nothing to the repo.
# Needs the BLOB_READ_WRITE_TOKEN repo secret (Settings > Secrets and variables > Actions).
on:
  # TEMPORARY (remove before merge): dispatch needs the file on main, so the first run
  # rides a push to the PR branch.
  push:
    branches: [claude/awesome-lamport-ko6ahv]
    paths: [.github/workflows/research-store.yml]
  workflow_dispatch:
    inputs:
      months:
        description: 'Months to build, comma-separated (03..11). Blank = every month so far.'
        type: string
        default: ''
      season:
        description: 'Season'
        type: string
        default: '2026'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check the secret is set
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then echo "::error::BLOB_READ_WRITE_TOKEN is not set"; exit 1; fi
          echo "BLOB_READ_WRITE_TOKEN is set (value not printed)."
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MONTHS: ${{ inputs.months || '' }}
          SEASON: ${{ inputs.season || '2026' }}
        run: |
          set -o pipefail
          node scripts/research/gen-research-store.mjs --season="$SEASON" ${MONTHS:+--months="$MONTHS"} --upload | tee build.log
      # The header test #2501 deferred: does Blob gzip the JSON, and does it allow CORS?
      - name: Check the served headers
        run: |
          url=$(grep -o 'https://[^ ]*index.json' build.log | tail -1)
          echo "index: $url"
          curl -sSI -H 'Accept-Encoding: gzip, br' -H 'Origin: https://bbsbh.vercel.app' "$url" | grep -iE '^(HTTP|content-encoding|content-length|access-control-allow-origin|cache-control)'
          month=$(grep -o 'https://[^ ]*/[0-9][0-9]\.json' build.log | tail -1)
          echo "month: $month"
          curl -sSI -H 'Accept-Encoding: gzip, br' -H 'Origin: https://bbsbh.vercel.app' "$month" | grep -iE '^(HTTP|content-encoding|content-length|access-control-allow-origin|cache-control)'
