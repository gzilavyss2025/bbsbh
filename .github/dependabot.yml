# One grouped pull request a week per ecosystem, so dependency updates do not
# spend a Vercel deployment each (Hobby plan, docs/development.md). A pull request
# that changes package.json deploys, so the auto-merge rule in
# .claude/skills/steward/SKILL.md does not apply to it: merge these in a batch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # ESLint 10 does not install yet: eslint-plugin-react 7.37.5 allows `eslint`
    # up to 9, so `npm install` fails with ERESOLVE. Skip the 10.x pair (`eslint`
    # and `@eslint/js` move together) until the plugin supports it, then delete
    # these two entries. A later major (11) still comes through.
    ignore:
      - dependency-name: eslint
        versions: ["10.x"]
      - dependency-name: "@eslint/js"
        versions: ["10.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
