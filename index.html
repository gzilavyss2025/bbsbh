<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Warm the connections the very first screen needs, overlapping DNS +
         TCP + TLS (~200-400 ms each on mobile) with the HTML/JS download:
         statsapi is every data call including the slate's blocking schedule
         request; the two mlbstatic hosts serve team logos and headshots. The
         crossorigin attribute must match how each origin is actually used —
         statsapi is fetch() (CORS), the CDNs are plain <img> loads — or the
         warmed socket goes unused. -->
    <link rel="preconnect" href="https://statsapi.mlb.com" crossorigin />
    <link rel="preconnect" href="https://www.mlbstatic.com" />
    <link rel="preconnect" href="https://img.mlbstatic.com" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Use a new URL for the Tally mark so iOS does not reuse the old,
         aggressively cached home-screen icon. -->
    <link rel="apple-touch-icon" href="/icons/tally-baseball-mark-180.png" />
    <!-- Zoom stays enabled (WCAG 1.4.4 — installed PWAs enforce a zoom lock
         hard). Accidental double-tap zoom while scoring is prevented by
         touch-action: manipulation on the interactive controls instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6EFDC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Night mode (ADR-0130): set data-theme from the saved Appearance
         preference before first paint, so there is no light flash. A saved
         'system' leaves the attribute off; no saved choice (or a bad one) forces
         light until the person answers the night-mode bar (ADR-0131). Keep in step
         with hooks/preferences/useAppearancePreference.js. -->
    <script>
      var a = 'light'
      try {
        var v = JSON.parse(localStorage.getItem('bbsbh:prefs')).appearance.value
        if (v === 'light' || v === 'dark' || v === 'system') a = v
      } catch (e) {}
      if (a !== 'system') {
        document.documentElement.dataset.theme = a
        var c = a === 'dark' ? '#000000' : '#F6EFDC'
        var m = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < m.length; i++) m[i].content = c
      }
    </script>
    <!-- The standardized tag (for Chrome/Android, which warns on the Apple-
         only one); apple-mobile-web-app-capable stays too since iOS Safari
         still only honors its own prefixed version, not this one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <!-- Numbers all over this app are innings/scores, not phone numbers —
         stop Safari from auto-linking number-looking text (e.g. "3-2") into
         tappable tel: links. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- OG:BEGIN — link-preview tags (description + Open Graph + Twitter +
         title). For a shared DEEP LINK (a player, a matchup, a team, …), the
         /api/preview edge function replaces this WHOLE block at request time
         with that route's dynamic card + image (see api/preview.js,
         api/og.js, docs/adr/0012-dynamic-link-previews.md). The defaults below
         are the home-page card AND the fallback whenever a route can't be
         resolved — so they must stay valid on their own. og:image here is
         public/og-image.png, a hand-provided 1200×630 card. URLs must be
         ABSOLUTE for scrapers, and on the CANONICAL origin — tallybb.com, the
         apex, matching SITE_URL in src/copy/landing/site.js. Three hostnames
         serve these same bytes (the apex, www, and the bbsbh.vercel.app
         deployment name); only the apex may be advertised.

         THIS FILE DELIBERATELY DECLARES NO CANONICAL LINK. This shell
         is the SPA fallback for EVERY route vercel.json does not rewrite — `/`,
         a dated slate, Settings, the labs — so any hardcoded canonical here
         would tell each of those pages it is really the home page, which is
         worse than emitting none at all. The canonical is written per route by
         the two surfaces that know which route they are serving: api/preview.js
         for the ~30 rewritten deep links, and src/copy/landing/render.js for
         /learn. og:url below stays `/` because this block is BOTH the home-page
         card and the unresolved-route fallback, and a link preview naming the
         home page is a cosmetic miss — a wrong canonical is not.
         Keep the OG:BEGIN/OG:END markers intact — the injector keys on them. -->
    <meta
      name="description"
      content="Tally Baseball supports hand scoring, delayed game watching, and baseball research with live context and sealed game results."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tally Baseball" />
    <meta
      property="og:title"
      content="Tally Baseball"
    />
    <meta
      property="og:description"
      content="Hand scoring, delayed game watching, and baseball research with live context and sealed game results."
    />
    <meta property="og:url" content="https://tallybb.com/" />
    <meta property="og:image" content="https://tallybb.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tally Baseball companion for scorekeeping, delayed watching, and research."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tally Baseball"
    />
    <meta
      name="twitter:description"
      content="Hand scoring, delayed game watching, and baseball research with live context and sealed game results."
    />
    <meta name="twitter:image" content="https://tallybb.com/og-image.png" />
    <title>Tally Baseball</title>
    <!-- OG:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
